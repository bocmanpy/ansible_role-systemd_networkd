---
- name: "Systemd-networkd: find unmanaged interfaces files"
  ansible.builtin.find:
    path: "{{ lookup('ansible.builtin.vars', 'systemd_networkd_directory') }}"
    recurse: "no"
    file_type: "file"
    use_regex: "yes"
    patterns: "(.*).(network|netdev|link)"
    excludes: "{{ lookup('ansible.builtin.vars',
      'systemd_networkd_interfaces_files', default=[]) }}"
  register: "find_systemd_networkd_unmanaged_interfaces"
  when:
    - "lookup('ansible.builtin.vars', 'systemd_networkd_directory', default='')
      not in ['', [], '[]', None]"
- name: "Systemd-networkd: set unmanaged interfaces files"
  ansible.builtin.set_fact:
    systemd_networkd_unmanaged_files: "{{ lookup('ansible.builtin.vars',
      'find_systemd_networkd_unmanaged_interfaces')['files'] |
      map(attribute='path') | list }}"
- name: "Systemd-networkd: remove exists networkd interfaces"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop: "{{ lookup('ansible.builtin.vars',
    'systemd_networkd_unmanaged_files') }}"
  loop_control:
    label: "{{ 'Remove file: ' + item }}"
  when:
    - "lookup('ansible.builtin.vars', 'systemd_networkd_unmanaged_files',
      default='') not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'systemd_networkd_cleanup') is defined"
    - "lookup('ansible.builtin.vars', 'systemd_networkd_cleanup') == true"
- name: "Systemd-networkd: deploy interface"
  ansible.builtin.template:
    src: "interface.j2"
    dest: "{{ (lookup('ansible.builtin.vars', 'systemd_networkd_directory')) +
      '/' + outer_item + '.' + item }}"
    owner: "{{ lookup('ansible.builtin.vars', 'systemd_networkd_user') }}"
    group: "{{ lookup('ansible.builtin.vars', 'systemd_networkd_user') }}"
    mode: "0640"
  loop: "{{ lookup('ansible.builtin.vars', 'systemd_networkd_interfaces')
    [outer_item] | ansible.builtin.flatten(levels=1) }}"
  loop_control:
    label: "{{ 'Systemd-networkd: deploy interface:
      [' + outer_item + '.' + item + ']'}}"
  vars:
    interface_directive_options: "{{ lookup('ansible.builtin.vars',
      'systemd_networkd_interfaces')[outer_item][item] }}"
    interface_directive_section_list: "{{ lookup('ansible.builtin.vars',
      'systemd_networkd_interfaces')[outer_item][item] |
      ansible.builtin.flatten(levels=1) }}"
  notify: "Restart systemd-networkd"
