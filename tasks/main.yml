---
- name: "Systemd-networkd: run pre_req tasks"
  ansible.builtin.include_tasks: 'prereq.yml'
- name: "Systemd-networkd: run deploy_interfaces tasks"
  ansible.builtin.include_tasks: 'deploy_interface.yaml'
  loop:
    "{{ lookup('ansible.builtin.vars', 'systemd_networkd_interfaces_list') }}"
  loop_control:
    loop_var: 'outer_item'
  when:
    - "lookup('ansible.builtin.vars', 'systemd_networkd_interfaces', default=[])
        not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'systemd_networkd_interfaces', default=[])
        [outer_item] not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'systemd_networkd_interfaces_list', default=[])
        not in ['', [], '[]', None]"